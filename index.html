<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Physio Nest</title>
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Physio Nest" />
<meta name="theme-color" content="#1B3B2F" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%231B3B2F'/%3E%3Ctext x='50' y='65' font-size='55' text-anchor='middle' fill='%23C29B4F'%3E%F0%9F%8D%83%3C/text%3E%3C/svg%3E" />
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%231B3B2F'/%3E%3Ctext x='50' y='65' font-size='55' text-anchor='middle' fill='%23C29B4F'%3E%F0%9F%8D%83%3C/text%3E%3C/svg%3E" />
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js" crossorigin></script>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #F7F3EC; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .pn-root { background: #F7F3EC; color: #2B2B24; min-height: 100vh; max-width: 480px; margin: 0 auto; padding-bottom: 90px; position: relative; }
  .pn-serif { font-family: Georgia, "Times New Roman", serif; }
  .pn-header { background: linear-gradient(135deg, #1B3B2F, #122A21); color: #fff; padding: 22px 20px 18px; border-radius: 0 0 22px 22px; display: flex; justify-content: space-between; align-items: flex-start; }
  .pn-header-top { display: flex; align-items: center; gap: 8px; }
  .pn-header-title { font-size: 22px; font-weight: 700; letter-spacing: 0.3px; }
  .pn-header-sub { font-size: 12.5px; color: #E4CFA0; margin-top: 2px; letter-spacing: 0.5px; }
  .pn-lock-btn { background: rgba(255,255,255,0.12); border: none; color: #fff; border-radius: 10px; padding: 6px 9px; font-size: 15px; cursor: pointer; }
  .pn-content { padding: 16px; }
  .pn-tabs { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); max-width: 480px; width: 100%; background: #fff; border-top: 1px solid #E4DECF; display: flex; padding: 6px 4px calc(6px + env(safe-area-inset-bottom)); box-shadow: 0 -4px 14px rgba(0,0,0,0.06); overflow-x: auto; }
  .pn-tab { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; background: none; border: none; padding: 6px 2px; cursor: pointer; color: #6B6A5E; font-size: 10px; border-radius: 10px; min-width: 56px; }
  .pn-tab.active { color: #1B3B2F; font-weight: 600; }
  .pn-card { background: #FFFFFF; border: 1px solid #E4DECF; border-radius: 16px; padding: 16px; margin-bottom: 12px; }
  .pn-label { font-size: 12.5px; font-weight: 600; color: #6B6A5E; margin-bottom: 6px; display: block; text-transform: uppercase; letter-spacing: 0.4px; }
  .pn-input, .pn-select, .pn-textarea { width: 100%; padding: 11px 12px; border: 1.5px solid #E4DECF; border-radius: 10px; font-size: 15px; background: #fff; color: #2B2B24; font-family: inherit; }
  .pn-input:focus, .pn-select:focus, .pn-textarea:focus { outline: none; border-color: #C29B4F; }
  .pn-textarea { resize: vertical; min-height: 70px; }
  .pn-field { margin-bottom: 14px; }
  .pn-btn { background: #1B3B2F; color: #fff; border: none; border-radius: 12px; padding: 13px 18px; font-size: 15px; font-weight: 600; cursor: pointer; width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px; }
  .pn-btn:active { opacity: 0.85; }
  .pn-btn-outline { background: #fff; color: #1B3B2F; border: 1.5px solid #1B3B2F; }
  .pn-btn-gold { background: #C29B4F; color: #122A21; }
  .pn-btn-sm { padding: 9px 12px; font-size: 13.5px; width: auto; }
  .pn-chip-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .pn-chip { padding: 9px 14px; border-radius: 20px; border: 1.5px solid #E4DECF; background: #fff; font-size: 13.5px; cursor: pointer; color: #2B2B24; }
  .pn-chip.selected { background: #1B3B2F; color: #fff; border-color: #1B3B2F; }
  .pn-empty { text-align: center; padding: 40px 20px; color: #6B6A5E; }
  .pn-patient-row { display: flex; align-items: center; gap: 12px; padding: 13px 14px; background: #fff; border: 1px solid #E4DECF; border-radius: 14px; margin-bottom: 10px; cursor: pointer; }
  .pn-avatar { width: 42px; height: 42px; border-radius: 50%; background: #1B3B2F; color: #E4CFA0; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px; flex-shrink: 0; }
  .pn-badge { display: inline-block; font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 20px; }
  .pn-badge-warn { background: #FBF1DD; color: #8A6A1F; }
  .pn-badge-due { background: #F5E6E1; color: #A1442E; }
  .pn-visit-item { border-bottom: 1px solid #E4DECF; padding: 12px 0; cursor: pointer; }
  .pn-visit-item:last-child { border-bottom: none; }
  .pn-modal-overlay { position: fixed; inset: 0; background: rgba(20,30,25,0.5); display: flex; align-items: flex-end; max-width: 480px; margin: 0 auto; z-index: 50; }
  .pn-modal { background: #F7F3EC; width: 100%; border-radius: 20px 20px 0 0; padding: 20px; max-height: 85vh; overflow-y: auto; }
  .pn-toast { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%); background: #1B3B2F; color: #fff; padding: 10px 18px; border-radius: 30px; font-size: 13.5px; display: flex; gap: 6px; align-items: center; max-width: 440px; z-index: 60; }
  .pn-banner { background: #FBF1DD; border: 1px solid #E4CFA0; color: #6B5122; padding: 10px 14px; margin: 12px 16px 0; border-radius: 12px; font-size: 13px; display: flex; justify-content: space-between; align-items: center; gap: 8px; cursor: pointer; }
  .pn-stat-row { display: flex; gap: 10px; }
  .pn-stat { flex: 1; background: #fff; border: 1px solid #E4DECF; border-radius: 14px; padding: 12px; text-align: center; }
  .pn-stat-num { font-size: 20px; font-weight: 700; color: #1B3B2F; }
  .pn-stat-label { font-size: 10.5px; color: #6B6A5E; text-transform: uppercase; letter-spacing: 0.3px; margin-top: 2px; }
  .pn-progress-bar { background: #E4DECF; border-radius: 20px; height: 8px; overflow: hidden; margin-top: 6px; }
  .pn-progress-fill { background: #1B3B2F; height: 100%; border-radius: 20px; }
  .pn-time-row { display: flex; gap: 6px; }
  .pn-pw-wrap { position: relative; }
  .pn-pw-eye { position: absolute; right: 8px; top: 8px; background: none; border: none; font-size: 18px; cursor: pointer; padding: 4px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect } = React;
const GOLD = "#C29B4F", BORDER = "#E4DECF", MUTED = "#6B6A5E", FOREST = "#1B3B2F";

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
function todayStr() { return new Date().toISOString().slice(0, 10); }
function fmtDate(d) {
  if (!d) return "";
  const dt = new Date(d + "T00:00:00");
  return dt.toLocaleDateString("en-IN", { day: "numeric", month: "short", year: "numeric" });
}
function fmtMoney(n) { const v = Number(n) || 0; return "₹" + v.toLocaleString("en-IN"); }
function getWeekRange(base) {
  const date = new Date(base);
  const day = date.getDay();
  const diffToMonday = day === 0 ? -6 : 1 - day;
  const monday = new Date(date); monday.setDate(date.getDate() + diffToMonday); monday.setHours(0,0,0,0);
  const sunday = new Date(monday); sunday.setDate(monday.getDate() + 6); sunday.setHours(23,59,59,999);
  return { monday, sunday };
}

// ---- 12-hour time helpers ----
function nowHHMM() {
  const d = new Date();
  return String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0");
}
function timeToParts(hhmm) {
  if (!hhmm) return { h: "09", m: "00", ap: "AM" };
  let [h, m] = hhmm.split(":").map(Number);
  const ap = h >= 12 ? "PM" : "AM";
  let h12 = h % 12; if (h12 === 0) h12 = 12;
  return { h: String(h12).padStart(2,"0"), m: String(m).padStart(2,"0"), ap };
}
function partsToTime(h, m, ap) {
  let h24 = Number(h) % 12;
  if (ap === "PM") h24 += 12;
  return String(h24).padStart(2,"0") + ":" + String(m).padStart(2,"0");
}
function fmtTime12(hhmm) {
  if (!hhmm) return "";
  const { h, m, ap } = timeToParts(hhmm);
  return `${Number(h)}:${m} ${ap}`;
}
function calcDurationMin(arrival, completion) {
  if (!arrival || !completion) return null;
  const [ah, am] = arrival.split(":").map(Number);
  const [ch, cm] = completion.split(":").map(Number);
  let mins = (ch * 60 + cm) - (ah * 60 + am);
  if (mins < 0) mins += 24 * 60;
  return mins;
}
function fmtDuration(mins) {
  if (mins === null || mins === undefined || isNaN(mins)) return "";
  const h = Math.floor(mins / 60), m = mins % 60;
  return h > 0 ? `${h}h ${m}m` : `${m} min`;
}

function TimePicker12({ value, onChange }) {
  const { h, m, ap } = timeToParts(value);
  const hours = Array.from({ length: 12 }, (_, i) => String(i + 1).padStart(2, "0"));
  const minutes = ["00","05","10","15","20","25","30","35","40","45","50","55"];
  const upd = (nh, nm, nap) => onChange(partsToTime(nh, nm, nap));
  return (
    <div className="pn-time-row">
      <select className="pn-select" value={h} onChange={(e) => upd(e.target.value, m, ap)}>{hours.map((x) => <option key={x} value={x}>{x}</option>)}</select>
      <select className="pn-select" value={m} onChange={(e) => upd(h, e.target.value, ap)}>{minutes.map((x) => <option key={x} value={x}>{x}</option>)}</select>
      <select className="pn-select" style={{ maxWidth: 78 }} value={ap} onChange={(e) => upd(h, m, e.target.value)}><option>AM</option><option>PM</option></select>
    </div>
  );
}

function PasswordField({ value, onChange, placeholder }) {
  const [show, setShow] = useState(false);
  return (
    <div className="pn-pw-wrap">
      <input className="pn-input" style={{ paddingRight: 42 }} type={show ? "text" : "password"} value={value} onChange={onChange} placeholder={placeholder} />
      <button type="button" className="pn-pw-eye" onClick={() => setShow((s) => !s)}>{show ? "🙈" : "👁️"}</button>
    </div>
  );
}

function loadKey(key, fallback) {
  try { const v = localStorage.getItem("pn_" + key); return v ? JSON.parse(v) : fallback; }
  catch { return fallback; }
}
function saveKey(key, value) {
  try { localStorage.setItem("pn_" + key, JSON.stringify(value)); }
  catch (e) { console.error("Save failed", e); }
}
async function syncToSheets(url, secret, type, data) {
  if (!url) return;
  try {
    await fetch(url, { method: "POST", mode: "no-cors", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ type, data, secret }) });
  } catch (e) { console.error("Sheets sync failed", e); }
}
function normalizeDate(d) {
  if (!d) return "";
  const s = String(d);
  return s.includes("T") ? s.slice(0, 10) : s;
}
async function fetchFromSheet(url, secret, type) {
  if (!url) return null;
  try {
    const res = await fetch(`${url}?type=${type}&secret=${encodeURIComponent(secret)}`);
    const data = await res.json();
    return Array.isArray(data) ? data : null;
  } catch (e) { console.error("Fetch from sheet failed", e); return null; }
}
async function loadFromSheet(url, secret) {
  const rawPatients = await fetchFromSheet(url, secret, "patients");
  const rawVisits = await fetchFromSheet(url, secret, "visits");
  const rawPayments = await fetchFromSheet(url, secret, "payments");
  if (!rawPatients || !rawVisits) return null;

  const patients = rawPatients.filter((p) => p.ID).map((p) => ({
    id: String(p.ID), name: p.Name || "", phone: p.Phone || "",
    age: p.Age || "", gender: p.Gender || "",
    condition: p.Condition || "", occupation: p.Occupation || "", referredBy: p["Referred By"] || "",
    address: p.Address || "", emergencyName: p["Emergency Name"] || "", emergencyPhone: p["Emergency Phone"] || "",
    fee: p["Fee Per Session"] || "", advance: p["Advance Paid"] || "",
    treatmentPlan: p["Treatment Plan"] || "Open-ended", packageSessions: p["Package Sessions"] || "",
    idCardUrl: p["ID Card URL"] || "",
    addedDate: normalizeDate(p["Added Date"]),
  }));
  const nameToId = {};
  patients.forEach((p) => { nameToId[p.name] = p.id; });

  const visits = rawVisits.filter((v) => v.ID).map((v) => ({
    id: String(v.ID),
    patientId: nameToId[v["Patient Name"]] || v["Patient Name"],
    date: normalizeDate(v.Date), arrival: v.Arrival || "", completion: v.Completion || "",
    duration: v["Duration (min)"] || "",
    observations: v.Observations || "", treatment: v.Treatment || "",
    loggedAt: v["Logged At"] || "",
  }));

  const payments = (rawPayments || []).filter((p) => p.ID).map((p) => ({
    id: String(p.ID),
    patientId: nameToId[p["Patient Name"]] || p["Patient Name"],
    amount: p.Amount || 0, date: normalizeDate(p.Date), note: p.Note || "",
  }));

  return { patients, visits, payments };
}

function completedCount(patientId, visits) { return visits.filter((v) => v.patientId === patientId).length; }
function computeBalance(patient, visits, payments) {
  const fee = Number(patient.fee) || 0;
  const advance = Number(patient.advance) || 0;
  const topups = payments.filter((p) => p.patientId === patient.id).reduce((s, p) => s + (Number(p.amount) || 0), 0);
  const sessions = completedCount(patient.id, visits);
  return advance + topups - fee * sessions;
}
function sessionsRemaining(patient, visits) {
  if (patient.treatmentPlan !== "Fixed") return null;
  const total = Number(patient.packageSessions) || 0;
  return total - completedCount(patient.id, visits);
}

function downloadCSV(filename, rows) {
  if (!rows.length) return;
  const headers = Object.keys(rows[0]);
  const esc = (v) => `"${String(v ?? "").replace(/"/g, '""')}"`;
  const csv = [headers.join(","), ...rows.map((r) => headers.map((h) => esc(r[h])).join(","))].join("\n");
  const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function resizeImageFile(file, maxWidth) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, maxWidth / img.width);
        const canvas = document.createElement("canvas");
        canvas.width = img.width * scale; canvas.height = img.height * scale;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        const dataUrl = canvas.toDataURL("image/jpeg", 0.75);
        resolve({ base64: dataUrl.split(",")[1], mime: "image/jpeg" });
      };
      img.onerror = reject; img.src = e.target.result;
    };
    reader.onerror = reject; reader.readAsDataURL(file);
  });
}
function Toast({ message }) { if (!message) return null; return <div className="pn-toast">✓ {message}</div>; }

function LockScreen({ correctSecret, onUnlock }) {
  const [entered, setEntered] = useState(""), [error, setError] = useState(false);
  const submit = () => { if (entered === correctSecret) onUnlock(); else setError(true); };
  return (
    <div className="pn-root" style={{ display: "flex", alignItems: "center", justifyContent: "center", minHeight: "100vh" }}>
      <div style={{ width: "100%", padding: 24 }}>
        <div style={{ textAlign: "center", marginBottom: 20 }}>
          <div style={{ fontSize: 32 }}>🍃</div>
          <div className="pn-serif" style={{ fontSize: 22, fontWeight: 700, color: FOREST }}>Physio Nest</div>
          <div style={{ fontSize: 12.5, color: MUTED }}>Enter your password to continue</div>
        </div>
        <div className="pn-card">
          <PasswordField value={entered} onChange={(e) => { setEntered(e.target.value); setError(false); }} placeholder="Password" />
          {error && <div style={{ color: "#A1442E", fontSize: 12.5, marginTop: 8 }}>Incorrect password, try again.</div>}
          <button className="pn-btn" style={{ marginTop: 12 }} onClick={submit}>Unlock</button>
        </div>
      </div>
    </div>
  );
}

function PatientFormModal({ initial, onClose, onSave, title }) {
  const [name, setName] = useState(initial?.name || ""), [phone, setPhone] = useState(initial?.phone || "");
  const [age, setAge] = useState(initial?.age || ""), [gender, setGender] = useState(initial?.gender || "");
  const [condition, setCondition] = useState(initial?.condition || ""), [address, setAddress] = useState(initial?.address || "");
  const [occupation, setOccupation] = useState(initial?.occupation || ""), [referredBy, setReferredBy] = useState(initial?.referredBy || "");
  const [emergencyName, setEmergencyName] = useState(initial?.emergencyName || ""), [emergencyPhone, setEmergencyPhone] = useState(initial?.emergencyPhone || "");
  const [fee, setFee] = useState(initial?.fee || ""), [advance, setAdvance] = useState(initial?.advance || "");
  const [treatmentPlan, setTreatmentPlan] = useState(initial?.treatmentPlan || "Open-ended"), [packageSessions, setPackageSessions] = useState(initial?.packageSessions || "");
  const [idCard, setIdCard] = useState(null), [idCardPreview, setIdCardPreview] = useState("");
  const [processing, setProcessing] = useState(false);

  const handleFile = async (e) => {
    const file = e.target.files[0]; if (!file) return;
    setProcessing(true);
    try { const { base64, mime } = await resizeImageFile(file, 1000); setIdCard({ base64, mime }); setIdCardPreview("data:" + mime + ";base64," + base64); }
    catch (err) { console.error(err); }
    setProcessing(false);
  };

  const handleSave = () => {
    if (!name.trim()) return;
    onSave({
      id: initial?.id || uid(), name, phone, age, gender, condition, occupation, referredBy, address,
      emergencyName, emergencyPhone, fee, advance, treatmentPlan,
      packageSessions: treatmentPlan === "Fixed" ? packageSessions : "",
      addedDate: initial?.addedDate || todayStr(),
      idCardBase64: idCard ? idCard.base64 : "",
      idCardMime: idCard ? idCard.mime : "",
      existingIdCardUrl: initial?.idCardUrl || "",
    });
  };

  return (
    <div className="pn-modal-overlay" onClick={onClose}>
      <div className="pn-modal" onClick={(e) => e.stopPropagation()}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16 }}>
          <h3 className="pn-serif" style={{ margin: 0, fontSize: 19 }}>{title}</h3>
          <button onClick={onClose} style={{ background: "none", border: "none", fontSize: 20 }}>✕</button>
        </div>
        <div className="pn-field"><label className="pn-label">Name</label>
          <input className="pn-input" value={name} onChange={(e) => setName(e.target.value)} placeholder="Patient name" /></div>
        <div style={{ display: "flex", gap: 10 }}>
          <div className="pn-field" style={{ flex: 1 }}><label className="pn-label">Age</label>
            <input className="pn-input" type="number" inputMode="numeric" value={age} onChange={(e) => setAge(e.target.value)} placeholder="e.g. 45" /></div>
          <div className="pn-field" style={{ flex: 1.4 }}><label className="pn-label">Gender</label>
            <select className="pn-select" value={gender} onChange={(e) => setGender(e.target.value)}>
              <option value="">Select...</option><option>Male</option><option>Female</option><option>Other</option>
            </select></div>
        </div>
        <div className="pn-field"><label className="pn-label">Phone</label>
          <input className="pn-input" value={phone} onChange={(e) => setPhone(e.target.value)} placeholder="+91..." /></div>
        <div className="pn-field"><label className="pn-label">Condition / issue</label>
          <input className="pn-input" value={condition} onChange={(e) => setCondition(e.target.value)} placeholder="e.g. Post-surgery knee rehab" /></div>
        <div className="pn-field"><label className="pn-label">Occupation</label>
          <input className="pn-input" value={occupation} onChange={(e) => setOccupation(e.target.value)} placeholder="e.g. Desk job, homemaker, driver" /></div>
        <div className="pn-field"><label className="pn-label">Referred by</label>
          <input className="pn-input" value={referredBy} onChange={(e) => setReferredBy(e.target.value)} placeholder="Self / Dr. name / friend, etc." /></div>
        <div className="pn-field"><label className="pn-label">Address</label>
          <textarea className="pn-textarea" value={address} onChange={(e) => setAddress(e.target.value)} placeholder="Home visit address" /></div>
        <div style={{ display: "flex", gap: 10 }}>
          <div className="pn-field" style={{ flex: 1.4 }}><label className="pn-label">Emergency contact name</label>
            <input className="pn-input" value={emergencyName} onChange={(e) => setEmergencyName(e.target.value)} placeholder="Optional" /></div>
          <div className="pn-field" style={{ flex: 1 }}><label className="pn-label">Emergency phone</label>
            <input className="pn-input" value={emergencyPhone} onChange={(e) => setEmergencyPhone(e.target.value)} placeholder="Optional" /></div>
        </div>
        <div className="pn-card" style={{ margin: "4px 0 14px", padding: 14 }}>
          <div className="pn-label" style={{ marginBottom: 10 }}>Fees & payment</div>
          <div style={{ display: "flex", gap: 10 }}>
            <div className="pn-field" style={{ flex: 1 }}><label className="pn-label">Fee per session (₹)</label>
              <input className="pn-input" type="number" inputMode="numeric" value={fee} onChange={(e) => setFee(e.target.value)} placeholder="e.g. 500" /></div>
            <div className="pn-field" style={{ flex: 1 }}><label className="pn-label">Advance paid (₹)</label>
              <input className="pn-input" type="number" inputMode="numeric" value={advance} onChange={(e) => setAdvance(e.target.value)} placeholder="e.g. 5000" /></div>
          </div>
          <label className="pn-label">Treatment plan</label>
          <div className="pn-chip-row" style={{ marginBottom: treatmentPlan === "Fixed" ? 12 : 0 }}>

            <div className={`pn-chip ${treatmentPlan === "Fixed" ? "selected" : ""}`} onClick={() => setTreatmentPlan("Fixed")}>Fixed package</div>
          </div>
          {treatmentPlan === "Fixed" && (
            <div className="pn-field" style={{ marginBottom: 0 }}><label className="pn-label">Number of sessions</label>
              <input className="pn-input" type="number" inputMode="numeric" value={packageSessions} onChange={(e) => setPackageSessions(e.target.value)} placeholder="e.g. 10" /></div>
          )}

}

function VisitFormModal({ patients, initial, lockedPatientId, onClose, onSave, title }) {

  const [treatment, setTreatment] = useState(initial?.treatment || "");

  const handleSave = () => {
    if (!canSave) return;
    onSave({
      id: initial?.id || uid(), patientId, date, arrival, completion,
      duration: duration !== null ? duration : "",
      observations, treatment, loggedAt: initial?.loggedAt || new Date().toISOString(),
    });
  };

  return (
    <div className="pn-modal-overlay" onClick={onClose}>
      <div className="pn-modal" onClick={(e) => e.stopPropagation()}>

          <h3 className="pn-serif" style={{ margin: 0, fontSize: 19 }}>{title}</h3>

      {showEditPatient && <PatientFormModal title="Edit patient" initial={patient} onClose={() => setShowEditPatient(false)} onSave={(p) => { onEditPatient(p); setShowEditPatient(false); }} />}

function DashboardTab({ patients, visits, payments, sheetsUrl, sheetsSecret }) {
  const { monday, sunday } = getWeekRange(new Date());
  const [bookings, setBookings] = useState([]);
  useEffect(() => { (async () => { const raw = await fetchFromSheet(sheetsUrl, sheetsSecret, "bookings"); if (raw) setBookings(raw); })(); }, [sheetsUrl, sheetsSecret]);

  const inWeek = (dstr) => { if (!dstr) return false; const d = new Date(normalizeDate(dstr) + "T00:00:00"); return d >= monday && d <= sunday; };
  const weekVisits = visits.filter((v) => inWeek(v.date));
  const patientName = (id) => patients.find((p) => p.id === id)?.name || "Unknown";
  const byPatient = {};
  weekVisits.forEach((v) => { byPatient[v.patientId] = (byPatient[v.patientId] || 0) + 1; });
  const revenue = weekVisits.reduce((sum, v) => { const p = patients.find((pp) => pp.id === v.patientId); return sum + (p ? Number(p.fee) || 0 : 0); }, 0);
  const lowPackage = patients.filter((p) => { const r = sessionsRemaining(p, visits); return r !== null && r <= 2; });
  const duePatients = patients.filter((p) => computeBalance(p, visits, payments) < 0);
  const today = new Date(); today.setHours(0,0,0,0);
  const upcomingBookings = bookings.filter((b) => { const d = new Date(normalizeDate(b["Slot Date"]) + "T00:00:00"); return d >= today && d <= sunday; })
    .sort((a,b) => String(a["Slot Date"]).localeCompare(String(b["Slot Date"])));

  return (
    <div>
      <div className="pn-card">
        <div className="pn-serif" style={{ fontSize: 17, fontWeight: 700, marginBottom: 4 }}>This week</div>
        <div style={{ fontSize: 12.5, color: MUTED, marginBottom: 12 }}>{fmtDate(monday.toISOString().slice(0,10))} – {fmtDate(sunday.toISOString().slice(0,10))}</div>
        <div className="pn-stat-row">
          <div className="pn-stat"><div className="pn-stat-num">{weekVisits.length}</div><div className="pn-stat-label">Sessions</div></div>
          <div className="pn-stat"><div className="pn-stat-num">{fmtMoney(revenue)}</div><div className="pn-stat-label">Collected</div></div>
          <div className="pn-stat"><div className="pn-stat-num">{Object.keys(byPatient).length}</div><div className="pn-stat-label">Patients seen</div></div>
        </div>
      </div>
      {Object.keys(byPatient).length > 0 && (
        <div className="pn-card"><div className="pn-label" style={{ marginBottom: 8 }}>Sessions by patient</div>
          {Object.entries(byPatient).map(([id, count]) => (
            <div key={id} style={{ display: "flex", justifyContent: "space-between", fontSize: 13.5, padding: "4px 0" }}>
              <span>{patientName(id)}</span><span style={{ color: MUTED }}>{count} session{count !== 1 ? "s" : ""}</span></div>
          ))}</div>
      )}
      {lowPackage.length > 0 && (
        <div className="pn-card"><div className="pn-label" style={{ marginBottom: 8 }}>Packages running low</div>
          {lowPackage.map((p) => { const r = sessionsRemaining(p, visits);
            return <div key={p.id} style={{ fontSize: 13.5, padding: "4px 0" }}>{p.name} — {r <= 0 ? "finished" : `${r} session${r !== 1 ? "s" : ""} left`}</div>; })}</div>
      )}
      {duePatients.length > 0 && (
        <div className="pn-card"><div className="pn-label" style={{ marginBottom: 8 }}>Payment follow-ups</div>
          {duePatients.map((p) => { const bal = computeBalance(p, visits, payments);
            return <div key={p.id} style={{ fontSize: 13.5, padding: "4px 0", color: "#A1442E" }}>{p.name} — due {fmtMoney(-bal)}</div>; })}</div>
      )}
      <div className="pn-card"><div className="pn-label" style={{ marginBottom: 8 }}>Upcoming bookings this week</div>
        {upcomingBookings.length === 0 ? <div style={{ fontSize: 13.5, color: MUTED }}>None found, or Sync not connected.</div> :
          upcomingBookings.map((b, i) => <div key={i} style={{ fontSize: 13.5, padding: "4px 0" }}>{fmtDate(b["Slot Date"])} {b["Slot Time"]} — {b["Patient / Guest"]}</div>)}
      </div>
    </div>
  );
}

      <div style={{ fontSize: 13, color: MUTED, marginBottom: 12 }}>Paste the Web App URL and your secret password. Both are saved only on this device — never in the app's code.</div>
      <label className="pn-label">Web App URL</label>
      <input className="pn-input" value={url} onChange={(e) => { setUrl(e.target.value); setSaved(false); }} placeholder="https://script.google.com/macros/s/..." />
      <label className="pn-label" style={{ marginTop: 12 }}>Secret password</label>
      <PasswordField value={secret} onChange={(e) => { setSecret(e.target.value); setSaved(false); }} placeholder="Same word as CONFIG.SECRET" />
      <button className="pn-btn" style={{ marginTop: 12 }} onClick={() => { onSave(url, secret); setSaved(true); }}>✓ Save</button>
      {saved && <div style={{ fontSize: 12.5, color: FOREST, marginTop: 8, textAlign: "center" }}>Saved. New entries will sync from now on.</div>}
    </div>
  );
}

function App() {
  const [tab, setTab] = useState("log");
  const [patients, setPatients] = useState(() => loadKey("patients", []));
  const [visits, setVisits] = useState(() => loadKey("visits", []));
  const [payments, setPayments] = useState(() => loadKey("payments", []));
  const [selectedPatient, setSelectedPatient] = useState(null);
  const [toast, setToast] = useState("");
  const [sheetsUrl, setSheetsUrl] = useState(() => loadKey("sheetsUrl", ""));
  const [sheetsSecret, setSheetsSecret] = useState(() => loadKey("sheetsSecret", ""));
  const [refreshing, setRefreshing] = useState(false);
  const [bannerDismissed, setBannerDismissed] = useState(false);
  const [unlocked, setUnlocked] = useState(() => { const s = loadKey("sheetsSecret", ""); return !s || loadKey("unlocked", false); });

  const refreshFromSheet = async (url, secret) => {
    if (!url || !secret) return;
    setRefreshing(true);
    const result = await loadFromSheet(url, secret);
    if (result) {
      setPatients(result.patients); saveKey("patients", result.patients);
      setVisits(result.visits); saveKey("visits", result.visits);
      setPayments(result.payments); saveKey("payments", result.payments);
    }
    setRefreshing(false);
  };
  useEffect(() => { if (sheetsUrl && sheetsSecret && unlocked) refreshFromSheet(sheetsUrl, sheetsSecret); }, [unlocked]);

  const showToast = (msg) => { setToast(msg); setTimeout(() => setToast(""), 2200); };
  const saveSheetsConfig = (url, secret) => {
    setSheetsUrl(url); saveKey("sheetsUrl", url);
    setSheetsSecret(secret); saveKey("sheetsSecret", secret);
    if (url && secret) refreshFromSheet(url, secret);
  };
  const addPatient = async (p) => {
    const localP = { ...p }; delete localP.idCardBase64; delete localP.idCardMime; delete localP.existingIdCardUrl;
    const next = [...patients, localP]; setPatients(next); saveKey("patients", next);
    await syncToSheets(sheetsUrl, sheetsSecret, "patient", p); showToast("Patient added");
    if (sheetsUrl && sheetsSecret) setTimeout(() => refreshFromSheet(sheetsUrl, sheetsSecret), 1500);
  };
  const editPatient = async (p) => {
    const localP = { ...p }; delete localP.idCardBase64; delete localP.idCardMime; delete localP.existingIdCardUrl;
    if (!localP.idCardUrl) localP.idCardUrl = p.existingIdCardUrl || "";
    const next = patients.map((x) => x.id === p.id ? localP : x);
    setPatients(next); saveKey("patients", next);
    await syncToSheets(sheetsUrl, sheetsSecret, "editPatient", p); showToast("Patient updated");
    if (sheetsUrl && sheetsSecret) setTimeout(() => refreshFromSheet(sheetsUrl, sheetsSecret), 1500);
  };
  const addVisit = async (v) => {
    const next = [...visits, v]; setVisits(next); saveKey("visits", next);
    const patientName = patients.find((p) => p.id === v.patientId)?.name || "Unknown";
    await syncToSheets(sheetsUrl, sheetsSecret, "visit", { ...v, patientName }); showToast("Visit saved");
    if (sheetsUrl && sheetsSecret) setTimeout(() => refreshFromSheet(sheetsUrl, sheetsSecret), 1200);
  };
  const editVisit = async (v) => {
    const next = visits.map((x) => x.id === v.id ? v : x);
    setVisits(next); saveKey("visits", next);
    const patientName = patients.find((p) => p.id === v.patientId)?.name || "Unknown";
    await syncToSheets(sheetsUrl, sheetsSecret, "editVisit", { ...v, patientName }); showToast("Visit updated");
    if (sheetsUrl && sheetsSecret) setTimeout(() => refreshFromSheet(sheetsUrl, sheetsSecret), 1200);
  };
  const addPayment = async (pay) => {
    const next = [...payments, pay]; setPayments(next); saveKey("payments", next);
    const patientName = patients.find((p) => p.id === pay.patientId)?.name || "Unknown";
    await syncToSheets(sheetsUrl, sheetsSecret, "payment", { ...pay, patientName }); showToast("Payment added");
    if (sheetsUrl && sheetsSecret) setTimeout(() => refreshFromSheet(sheetsUrl, sheetsSecret), 1200);
  };
  const extendPackage = async (patientId, newTotal) => {
    const next = patients.map((p) => p.id === patientId ? { ...p, packageSessions: newTotal } : p);
    setPatients(next); saveKey("patients", next);
    await syncToSheets(sheetsUrl, sheetsSecret, "updatePatient", { id: patientId, field: "Package Sessions", value: newTotal });
    showToast("Package updated");
  };

  if (!unlocked) return <LockScreen correctSecret={sheetsSecret} onUnlock={() => { saveKey("unlocked", true); setUnlocked(true); }} />;

  const patientObj = selectedPatient ? patients.find((p) => p.id === selectedPatient) : null;
  const lowPackageCount = patients.filter((p) => { const r = sessionsRemaining(p, visits); return r !== null && r <= 2; }).length;
  const dueCount = patients.filter((p) => computeBalance(p, visits, payments) < 0).length;
  const alertCount = lowPackageCount + dueCount;

  return (
    <div className="pn-root">
      <div className="pn-header">
        <div>
          <div className="pn-header-top"><span style={{fontSize:20}}>🍃</span><span className="pn-header-title pn-serif">Physio Nest</span></div>
          <div className="pn-header-sub">PATIENT VISIT TRACKER{refreshing ? " · SYNCING…" : ""}</div>
        </div>
        {sheetsSecret && <button className="pn-lock-btn" onClick={() => { saveKey("unlocked", false); setUnlocked(false); }}>🔒</button>}
      </div>
      {alertCount > 0 && !bannerDismissed && (
        <div className="pn-banner" onClick={() => { setTab("dashboard"); setBannerDismissed(true); }}>
          <span>⚠ {lowPackageCount > 0 ? `${lowPackageCount} package${lowPackageCount !== 1 ? "s" : ""} running low` : ""}{lowPackageCount > 0 && dueCount > 0 ? " · " : ""}{dueCount > 0 ? `${dueCount} payment${dueCount !== 1 ? "s" : ""} due` : ""}</span>
          <span onClick={(e) => { e.stopPropagation(); setBannerDismissed(true); }} style={{ fontWeight: 700 }}>✕</span>
        </div>
      )}
      <div className="pn-content">
        {tab === "log" && <LogVisitTab patients={patients} onSave={addVisit} onAddPatient={addPatient} />}
        {tab === "patients" && !patientObj && <PatientsTab patients={patients} visits={visits} payments={payments} onAddPatient={addPatient} onSelect={setSelectedPatient} />}
        {tab === "patients" && patientObj && <PatientDetail patient={patientObj} visits={visits} payments={payments} onBack={() => setSelectedPatient(null)} onAddPayment={addPayment} onExtendPackage={extendPackage} onEditPatient={editPatient} onEditVisit={editVisit} />}
        {tab === "history" && <HistoryTab patients={patients} visits={visits} />}
        {tab === "dashboard" && <DashboardTab patients={patients} visits={visits} payments={payments} sheetsUrl={sheetsUrl} sheetsSecret={sheetsSecret} />}
        {tab === "sync" && <SyncTab sheetsUrl={sheetsUrl} sheetsSecret={sheetsSecret} onSave={saveSheetsConfig} />}
      </div>
      <div className="pn-tabs">
        <button className={`pn-tab ${tab === "log" ? "active" : ""}`} onClick={() => { setTab("log"); setSelectedPatient(null); }}>📋<br/>Log</button>
        <button className={`pn-tab ${tab === "patients" ? "active" : ""}`} onClick={() => { setTab("patients"); setSelectedPatient(null); }}>👤<br/>Patients</button>
        <button className={`pn-tab ${tab === "history" ? "active" : ""}`} onClick={() => { setTab("history"); setSelectedPatient(null); }}>📅<br/>History</button>
        <button className={`pn-tab ${tab === "dashboard" ? "active" : ""}`} onClick={() => { setTab("dashboard"); setSelectedPatient(null); }}>📊<br/>Weekly</button>
        <button className={`pn-tab ${tab === "sync" ? "active" : ""}`} onClick={() => { setTab("sync"); setSelectedPatient(null); }}>🔄<br/>Sync</button>
      </div>
      <Toast message={toast} />
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
