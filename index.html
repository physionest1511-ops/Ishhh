<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Physio Nest</title>
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Physio Nest" />
<meta name="theme-color" content="#1B3B2F" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%231B3B2F'/%3E%3Ctext x='50' y='65' font-size='55' text-anchor='middle' fill='%23C29B4F'%3E%F0%9F%8D%83%3C/text%3E%3C/svg%3E" />
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%231B3B2F'/%3E%3Ctext x='50' y='65' font-size='55' text-anchor='middle' fill='%23C29B4F'%3E%F0%9F%8D%83%3C/text%3E%3C/svg%3E" />
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js" crossorigin></script>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #F7F3EC; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .pn-root { background: #F7F3EC; color: #2B2B24; min-height: 100vh; max-width: 480px; margin: 0 auto; padding-bottom: 90px; position: relative; }
  .pn-serif { font-family: Georgia, "Times New Roman", serif; }
  .pn-header { background: linear-gradient(135deg, #1B3B2F, #122A21); color: #fff; padding: 22px 20px 18px; border-radius: 0 0 22px 22px; }
  .pn-header-top { display: flex; align-items: center; gap: 8px; }
  .pn-header-title { font-size: 22px; font-weight: 700; letter-spacing: 0.3px; }
  .pn-header-sub { font-size: 12.5px; color: #E4CFA0; margin-top: 2px; letter-spacing: 0.5px; }
  .pn-content { padding: 16px; }
  .pn-tabs { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); max-width: 480px; width: 100%; background: #fff; border-top: 1px solid #E4DECF; display: flex; padding: 8px 10px calc(8px + env(safe-area-inset-bottom)); box-shadow: 0 -4px 14px rgba(0,0,0,0.06); }
  .pn-tab { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; background: none; border: none; padding: 6px 4px; cursor: pointer; color: #6B6A5E; font-size: 11px; border-radius: 10px; }
  .pn-tab.active { color: #1B3B2F; font-weight: 600; }
  .pn-card { background: #FFFFFF; border: 1px solid #E4DECF; border-radius: 16px; padding: 16px; margin-bottom: 12px; }
  .pn-label { font-size: 12.5px; font-weight: 600; color: #6B6A5E; margin-bottom: 6px; display: block; text-transform: uppercase; letter-spacing: 0.4px; }
  .pn-input, .pn-select, .pn-textarea { width: 100%; padding: 11px 12px; border: 1.5px solid #E4DECF; border-radius: 10px; font-size: 15px; background: #fff; color: #2B2B24; font-family: inherit; }
  .pn-input:focus, .pn-select:focus, .pn-textarea:focus { outline: none; border-color: #C29B4F; }
  .pn-textarea { resize: vertical; min-height: 70px; }
  .pn-field { margin-bottom: 14px; }
  .pn-btn { background: #1B3B2F; color: #fff; border: none; border-radius: 12px; padding: 13px 18px; font-size: 15px; font-weight: 600; cursor: pointer; width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px; }
  .pn-btn:active { opacity: 0.85; }
  .pn-btn-outline { background: #fff; color: #1B3B2F; border: 1.5px solid #1B3B2F; }
  .pn-btn-gold { background: #C29B4F; color: #122A21; }
  .pn-chip-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .pn-chip { padding: 9px 14px; border-radius: 20px; border: 1.5px solid #E4DECF; background: #fff; font-size: 13.5px; cursor: pointer; color: #2B2B24; }
  .pn-chip.selected { background: #1B3B2F; color: #fff; border-color: #1B3B2F; }
  .pn-empty { text-align: center; padding: 40px 20px; color: #6B6A5E; }
  .pn-patient-row { display: flex; align-items: center; gap: 12px; padding: 13px 14px; background: #fff; border: 1px solid #E4DECF; border-radius: 14px; margin-bottom: 10px; cursor: pointer; }
  .pn-avatar { width: 42px; height: 42px; border-radius: 50%; background: #1B3B2F; color: #E4CFA0; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px; flex-shrink: 0; }
  .pn-badge { display: inline-block; font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 20px; }
  .pn-badge-done { background: #E5F0E9; color: #1B3B2F; }
  .pn-badge-cancel { background: #F5E6E1; color: #A1442E; }
  .pn-badge-resched { background: #FBF1DD; color: #8A6A1F; }
  .pn-visit-item { border-bottom: 1px solid #E4DECF; padding: 12px 0; }
  .pn-visit-item:last-child { border-bottom: none; }
  .pn-stars { display: flex; gap: 6px; }
  .pn-modal-overlay { position: fixed; inset: 0; background: rgba(20,30,25,0.5); display: flex; align-items: flex-end; max-width: 480px; margin: 0 auto; z-index: 50; }
  .pn-modal { background: #F7F3EC; width: 100%; border-radius: 20px 20px 0 0; padding: 20px; max-height: 85vh; overflow-y: auto; }
  .pn-toast { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%); background: #1B3B2F; color: #fff; padding: 10px 18px; border-radius: 30px; font-size: 13.5px; display: flex; gap: 6px; align-items: center; max-width: 440px; z-index: 60; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect } = React;
const GOLD = "#C29B4F", BORDER = "#E4DECF", MUTED = "#6B6A5E";

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
function todayStr() { return new Date().toISOString().slice(0, 10); }
function fmtDate(d) {
  if (!d) return "";
  const dt = new Date(d + "T00:00:00");
  return dt.toLocaleDateString("en-IN", { day: "numeric", month: "short", year: "numeric" });
}

function loadKey(key, fallback) {
  try {
    const v = localStorage.getItem("pn_" + key);
    return v ? JSON.parse(v) : fallback;
  } catch { return fallback; }
}
function saveKey(key, value) {
  try { localStorage.setItem("pn_" + key, JSON.stringify(value)); }
  catch (e) { console.error("Save failed", e); }
}
async function syncToSheets(url, secret, type, data) {
  if (!url) return;
  try {
    await fetch(url, { method: "POST", mode: "no-cors", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ type, data, secret }) });
  } catch (e) { console.error("Sheets sync failed", e); }
}

function normalizeDate(d) {
  if (!d) return "";
  const s = String(d);
  return s.includes("T") ? s.slice(0, 10) : s;
}

async function fetchFromSheet(url, secret, type) {
  if (!url) return null;
  try {
    const res = await fetch(`${url}?type=${type}&secret=${encodeURIComponent(secret)}`);
    const data = await res.json();
    return Array.isArray(data) ? data : null;
  } catch (e) {
    console.error("Fetch from sheet failed", e);
    return null;
  }
}

async function loadFromSheet(url, secret) {
  const rawPatients = await fetchFromSheet(url, secret, "patients");
  const rawVisits = await fetchFromSheet(url, secret, "visits");
  if (!rawPatients || !rawVisits) return null;

  const patients = rawPatients.filter((p) => p.ID).map((p) => ({
    id: String(p.ID), name: p.Name || "", phone: p.Phone || "",
    condition: p.Condition || "", address: p.Address || "",
    addedDate: normalizeDate(p["Added Date"]),
  }));
  const nameToId = {};
  patients.forEach((p) => { nameToId[p.name] = p.id; });

  const visits = rawVisits.filter((v) => v.ID).map((v) => ({
    id: String(v.ID),
    patientId: nameToId[v["Patient Name"]] || v["Patient Name"],
    date: normalizeDate(v.Date), status: v.Status || "", arrival: v.Arrival || "",
    observations: v.Observations || "", treatment: v.Treatment || "", feedback: v.Feedback || "",
    rating: Number(v.Rating) || 0, nextVisit: v["Next Visit Needed"] || "", reason: v.Reason || "",
    loggedAt: v["Logged At"] || "",
  }));
  return { patients, visits };
}
function downloadCSV(filename, rows) {
  if (!rows.length) return;
  const headers = Object.keys(rows[0]);
  const esc = (v) => `"${String(v ?? "").replace(/"/g, '""')}"`;
  const csv = [headers.join(","), ...rows.map((r) => headers.map((h) => esc(r[h])).join(","))].join("\n");
  const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function Star({ filled }) {
  return <span style={{ color: filled ? GOLD : BORDER, fontSize: 20, cursor: "pointer" }}>★</span>;
}

function Toast({ message }) {
  if (!message) return null;
  return <div className="pn-toast">✓ {message}</div>;
}

function AddPatientModal({ onClose, onSave }) {
  const [name, setName] = useState(""), [phone, setPhone] = useState("");
  const [condition, setCondition] = useState(""), [address, setAddress] = useState("");
  return (
    <div className="pn-modal-overlay" onClick={onClose}>
      <div className="pn-modal" onClick={(e) => e.stopPropagation()}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16 }}>
          <h3 className="pn-serif" style={{ margin: 0, fontSize: 19 }}>New patient</h3>
          <button onClick={onClose} style={{ background: "none", border: "none", fontSize: 20 }}>✕</button>
        </div>
        <div className="pn-field"><label className="pn-label">Name</label>
          <input className="pn-input" value={name} onChange={(e) => setName(e.target.value)} placeholder="Patient name" /></div>
        <div className="pn-field"><label className="pn-label">Phone</label>
          <input className="pn-input" value={phone} onChange={(e) => setPhone(e.target.value)} placeholder="+91..." /></div>
        <div className="pn-field"><label className="pn-label">Condition / issue</label>
          <input className="pn-input" value={condition} onChange={(e) => setCondition(e.target.value)} placeholder="e.g. Post-surgery knee rehab" /></div>
        <div className="pn-field"><label className="pn-label">Address</label>
          <textarea className="pn-textarea" value={address} onChange={(e) => setAddress(e.target.value)} placeholder="Home visit address" /></div>
        <button className="pn-btn" disabled={!name.trim()} style={{ opacity: name.trim() ? 1 : 0.5 }}
          onClick={() => { if (name.trim()) onSave({ id: uid(), name, phone, condition, address, addedDate: todayStr() }); }}>
          + Add patient
        </button>
      </div>
    </div>
  );
}

function LogVisitTab({ patients, onSave, onAddPatient }) {
  const [patientId, setPatientId] = useState(""), [status, setStatus] = useState("Completed");
  const [date, setDate] = useState(todayStr()), [arrival, setArrival] = useState("");
  const [observations, setObservations] = useState(""), [treatment, setTreatment] = useState("");
  const [feedback, setFeedback] = useState(""), [rating, setRating] = useState(0);
  const [nextVisit, setNextVisit] = useState(""), [reason, setReason] = useState("");
  const [showAdd, setShowAdd] = useState(false);

  const reset = () => { setStatus("Completed"); setArrival(""); setObservations(""); setTreatment(""); setFeedback(""); setRating(0); setNextVisit(""); setReason(""); setDate(todayStr()); };
  const canSave = patientId && (status !== "Completed" || arrival);
  const handleSave = () => {
    onSave({ id: uid(), patientId, date, status,
      arrival: status === "Completed" ? arrival : "",
      observations: status === "Completed" ? observations : "",
      treatment: status === "Completed" ? treatment : "",
      feedback: status === "Completed" ? feedback : "",
      rating: status === "Completed" ? rating : 0,
      nextVisit: status === "Completed" ? nextVisit : "",
      reason: status !== "Completed" ? reason : "",
      loggedAt: new Date().toISOString() });
    reset();
  };

  return (
    <div>
      <div className="pn-card">
        <label className="pn-label">Patient</label>
        {patients.length === 0 ? <div style={{ fontSize: 13.5, color: MUTED, marginBottom: 10 }}>No patients yet — add one to get started.</div> :
          <select className="pn-select" value={patientId} onChange={(e) => setPatientId(e.target.value)}>
            <option value="">Select patient...</option>
            {patients.map((p) => <option key={p.id} value={p.id}>{p.name}</option>)}
          </select>}
        <button className="pn-btn pn-btn-outline" style={{ marginTop: 10 }} onClick={() => setShowAdd(true)}>+ Add new patient</button>
      </div>
      <div className="pn-card">
        <div className="pn-field"><label className="pn-label">Date</label>
          <input type="date" className="pn-input" value={date} onChange={(e) => setDate(e.target.value)} /></div>
        <div className="pn-field"><label className="pn-label">Visit status</label>
          <div className="pn-chip-row">{["Completed", "Cancelled", "Rescheduled"].map((s) =>
            <div key={s} className={`pn-chip ${status === s ? "selected" : ""}`} onClick={() => setStatus(s)}>{s}</div>)}</div></div>
        {status === "Completed" ? (<>
          <div className="pn-field"><label className="pn-label">Arrival time</label>
            <input type="time" className="pn-input" value={arrival} onChange={(e) => setArrival(e.target.value)} /></div>
          <div className="pn-field"><label className="pn-label">Observations</label>
            <textarea className="pn-textarea" value={observations} onChange={(e) => setObservations(e.target.value)} placeholder="Condition today, progress noticed..." /></div>
          <div className="pn-field"><label className="pn-label">Treatment given</label>
            <textarea className="pn-textarea" value={treatment} onChange={(e) => setTreatment(e.target.value)} placeholder="Exercises, manual therapy, etc." /></div>
          <div className="pn-field"><label className="pn-label">Patient feedback</label>
            <textarea className="pn-textarea" value={feedback} onChange={(e) => setFeedback(e.target.value)} placeholder="What they said about the session" /></div>
          <div className="pn-field"><label className="pn-label">Session rating</label>
            <div className="pn-stars">{[1,2,3,4,5].map((n) => <span key={n} onClick={() => setRating(n)}><Star filled={n <= rating} /></span>)}</div></div>
          <div className="pn-field"><label className="pn-label">Next visit needed?</label>
            <div className="pn-chip-row">{["Yes","No","Not sure"].map((s) =>
              <div key={s} className={`pn-chip ${nextVisit === s ? "selected" : ""}`} onClick={() => setNextVisit(s)}>{s}</div>)}</div></div>
        </>) : (
          <div className="pn-field"><label className="pn-label">Reason</label>
            <textarea className="pn-textarea" value={reason} onChange={(e) => setReason(e.target.value)} placeholder="Why was it cancelled / rescheduled?" /></div>
        )}
        <button className="pn-btn" style={{ opacity: canSave ? 1 : 0.5, marginTop: 6 }} disabled={!canSave} onClick={handleSave}>✓ Save visit</button>
      </div>
      {showAdd && <AddPatientModal onClose={() => setShowAdd(false)} onSave={(p) => { onAddPatient(p); setPatientId(p.id); setShowAdd(false); }} />}
    </div>
  );
}

function PatientsTab({ patients, visits, onAddPatient, onSelect }) {
  const [showAdd, setShowAdd] = useState(false);
  return (
    <div>
      <button className="pn-btn pn-btn-gold" style={{ marginBottom: 14 }} onClick={() => setShowAdd(true)}>+ Add patient</button>
      {patients.length === 0 ? <div className="pn-empty">No patients added yet.</div> :
        patients.map((p) => {
          const pv = visits.filter((v) => v.patientId === p.id);
          const last = pv.length ? pv.slice().sort((a,b) => b.date.localeCompare(a.date))[0] : null;
          return (
            <div key={p.id} className="pn-patient-row" onClick={() => onSelect(p.id)}>
              <div className="pn-avatar">{p.name.charAt(0).toUpperCase()}</div>
              <div style={{ flex: 1 }}>
                <div style={{ fontWeight: 600, fontSize: 15 }}>{p.name}</div>
                <div style={{ fontSize: 12.5, color: MUTED }}>{pv.length} visit{pv.length !== 1 ? "s" : ""}{last ? ` · last ${fmtDate(last.date)}` : ""}</div>
              </div>
            </div>
          );
        })}
      {showAdd && <AddPatientModal onClose={() => setShowAdd(false)} onSave={(p) => { onAddPatient(p); setShowAdd(false); }} />}
    </div>
  );
}

function PatientDetail({ patient, visits, onBack }) {
  const pv = visits.filter((v) => v.patientId === patient.id).sort((a,b) => b.date.localeCompare(a.date));
  const exportPatient = () => downloadCSV(`${patient.name.replace(/\s+/g,"_")}_records.csv`, pv.map((v) => ({
    Date: fmtDate(v.date), Status: v.status, Arrival: v.arrival, Observations: v.observations,
    Treatment: v.treatment, Feedback: v.feedback, Rating: v.rating, "Next Visit Needed": v.nextVisit, Reason: v.reason })));
  return (
    <div>
      <button onClick={onBack} style={{ background: "none", border: "none", color: "#1B3B2F", fontWeight: 600, marginBottom: 12, padding: 0 }}>‹ All patients</button>
      <div className="pn-card">
        <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 10 }}>
          <div className="pn-avatar" style={{ width: 50, height: 50, fontSize: 18 }}>{patient.name.charAt(0).toUpperCase()}</div>
          <div><div className="pn-serif" style={{ fontSize: 18, fontWeight: 700 }}>{patient.name}</div>
            <div style={{ fontSize: 12.5, color: MUTED }}>{patient.condition}</div></div>
        </div>
        {patient.phone && <div style={{ fontSize: 13.5, marginBottom: 4 }}>📞 {patient.phone}</div>}
        {patient.address && <div style={{ fontSize: 13.5 }}>📍 {patient.address}</div>}
      </div>
      <button className="pn-btn pn-btn-outline" style={{ marginBottom: 14 }} onClick={exportPatient}>⬇ Export {patient.name}'s records (CSV)</button>
      <div className="pn-card">
        <div className="pn-label" style={{ marginBottom: 10 }}>Visit history ({pv.length})</div>
        {pv.length === 0 ? <div style={{ fontSize: 13.5, color: MUTED }}>No visits logged yet.</div> :
          pv.map((v) => (
            <div key={v.id} className="pn-visit-item">
              <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 4 }}>
                <span style={{ fontWeight: 600, fontSize: 14 }}>{fmtDate(v.date)}</span>
                <span className={`pn-badge ${v.status === "Completed" ? "pn-badge-done" : v.status === "Cancelled" ? "pn-badge-cancel" : "pn-badge-resched"}`}>{v.status}</span>
              </div>
              {v.status === "Completed" ? (<>
                {v.arrival && <div style={{ fontSize: 13, color: MUTED }}>Arrived {v.arrival}</div>}
                {v.observations && <div style={{ fontSize: 13.5, marginTop: 4 }}>{v.observations}</div>}
                {v.treatment && <div style={{ fontSize: 13, color: MUTED, marginTop: 2 }}>Treatment: {v.treatment}</div>}
                {v.feedback && <div style={{ fontSize: 13, marginTop: 4, fontStyle: "italic" }}>"{v.feedback}"</div>}
                {v.rating > 0 && <div style={{ display: "flex", gap: 2, marginTop: 4 }}>{[1,2,3,4,5].map((n) => <Star key={n} filled={n <= v.rating} />)}</div>}
              </>) : (v.reason && <div style={{ fontSize: 13.5, marginTop: 4 }}>{v.reason}</div>)}
            </div>
          ))}
      </div>
    </div>
  );
}

function HistoryTab({ patients, visits }) {
  const [filter, setFilter] = useState("");
  const patientName = (id) => patients.find((p) => p.id === id)?.name || "Unknown";
  const filtered = (filter ? visits.filter((v) => v.patientId === filter) : visits).slice().sort((a,b) => b.date.localeCompare(a.date));
  const exportAll = () => downloadCSV("all_visits_log.csv", visits.slice().sort((a,b) => b.date.localeCompare(a.date)).map((v) => ({
    Date: fmtDate(v.date), Patient: patientName(v.patientId), Status: v.status, Arrival: v.arrival,
    Observations: v.observations, Treatment: v.treatment, Feedback: v.feedback, Rating: v.rating, "Next Visit Needed": v.nextVisit, Reason: v.reason })));
  return (
    <div>
      <div className="pn-card">
        <label className="pn-label">Filter by patient</label>
        <select className="pn-select" value={filter} onChange={(e) => setFilter(e.target.value)}>
          <option value="">All patients</option>
          {patients.map((p) => <option key={p.id} value={p.id}>{p.name}</option>)}
        </select>
      </div>
      <button className="pn-btn pn-btn-outline" style={{ marginBottom: 14 }} onClick={exportAll} disabled={!visits.length}>⬇ Export master log (CSV)</button>
      {filtered.length === 0 ? <div className="pn-empty">No visits logged yet.</div> :
        <div className="pn-card">{filtered.map((v) => (
          <div key={v.id} className="pn-visit-item">
            <div style={{ display: "flex", justifyContent: "space-between" }}>
              <span style={{ fontWeight: 600, fontSize: 14 }}>{patientName(v.patientId)}</span>
              <span className={`pn-badge ${v.status === "Completed" ? "pn-badge-done" : v.status === "Cancelled" ? "pn-badge-cancel" : "pn-badge-resched"}`}>{v.status}</span>
            </div>
            <div style={{ fontSize: 12.5, color: MUTED, marginTop: 2 }}>{fmtDate(v.date)}{v.arrival ? ` · ${v.arrival}` : ""}</div>
            {v.observations && <div style={{ fontSize: 13, marginTop: 4 }}>{v.observations}</div>}
          </div>
        ))}</div>}
    </div>
  );
}

function SyncTab({ sheetsUrl, sheetsSecret, onSave }) {
  const [url, setUrl] = useState(sheetsUrl), [secret, setSecret] = useState(sheetsSecret), [saved, setSaved] = useState(false);
  return (
    <div className="pn-card">
      <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 10 }}>
        <span className="pn-serif" style={{ fontSize: 17, fontWeight: 700 }}>🔄 Google Sheets sync</span>
      </div>
      <div style={{ fontSize: 13, color: MUTED, marginBottom: 12 }}>Paste the Web App URL and your secret password from your Apps Script deployment. Both are saved only on this device — never in the app's code.</div>
      <label className="pn-label">Web App URL</label>
      <input className="pn-input" value={url} onChange={(e) => { setUrl(e.target.value); setSaved(false); }} placeholder="https://script.google.com/macros/s/..." />
      <label className="pn-label" style={{ marginTop: 12 }}>Secret password</label>
      <input className="pn-input" type="password" value={secret} onChange={(e) => { setSecret(e.target.value); setSaved(false); }} placeholder="Same word as CONFIG.SECRET in your script" />
      <button className="pn-btn" style={{ marginTop: 12 }} onClick={() => { onSave(url, secret); setSaved(true); }}>✓ Save</button>
      {saved && <div style={{ fontSize: 12.5, color: "#1B3B2F", marginTop: 8, textAlign: "center" }}>Saved. New entries will sync from now on.</div>}
    </div>
  );
}

function App() {
  const [tab, setTab] = useState("log");
  const [patients, setPatients] = useState(() => loadKey("patients", []));
  const [visits, setVisits] = useState(() => loadKey("visits", []));
  const [selectedPatient, setSelectedPatient] = useState(null);
  const [toast, setToast] = useState("");
  const [sheetsUrl, setSheetsUrl] = useState(() => loadKey("sheetsUrl", ""));
  const [sheetsSecret, setSheetsSecret] = useState(() => loadKey("sheetsSecret", ""));
  const [refreshing, setRefreshing] = useState(false);

  const refreshFromSheet = async (url, secret) => {
    if (!url || !secret) return;
    setRefreshing(true);
    const result = await loadFromSheet(url, secret);
    if (result) {
      setPatients(result.patients); saveKey("patients", result.patients);
      setVisits(result.visits); saveKey("visits", result.visits);
    }
    setRefreshing(false);
  };

  useEffect(() => { if (sheetsUrl && sheetsSecret) refreshFromSheet(sheetsUrl, sheetsSecret); }, []);

  const showToast = (msg) => { setToast(msg); setTimeout(() => setToast(""), 2200); };
  const saveSheetsConfig = (url, secret) => {
    setSheetsUrl(url); saveKey("sheetsUrl", url);
    setSheetsSecret(secret); saveKey("sheetsSecret", secret);
    if (url && secret) refreshFromSheet(url, secret);
  };
  const addPatient = async (p) => {
    const next = [...patients, p]; setPatients(next); saveKey("patients", next);
    await syncToSheets(sheetsUrl, sheetsSecret, "patient", p); showToast("Patient added");
    if (sheetsUrl && sheetsSecret) setTimeout(() => refreshFromSheet(sheetsUrl, sheetsSecret), 1200);
  };
  const addVisit = async (v) => {
    const next = [...visits, v]; setVisits(next); saveKey("visits", next);
    const patientName = patients.find((p) => p.id === v.patientId)?.name || "Unknown";
    await syncToSheets(sheetsUrl, sheetsSecret, "visit", { ...v, patientName }); showToast("Visit saved");
    if (sheetsUrl && sheetsSecret) setTimeout(() => refreshFromSheet(sheetsUrl, sheetsSecret), 1200);
  };

  const patientObj = selectedPatient ? patients.find((p) => p.id === selectedPatient) : null;

  return (
    <div className="pn-root">
      <div className="pn-header">
        <div className="pn-header-top"><span style={{fontSize:20}}>🍃</span><span className="pn-header-title pn-serif">Physio Nest</span></div>
        <div className="pn-header-sub">PATIENT VISIT TRACKER{refreshing ? " · SYNCING…" : ""}</div>
      </div>
      <div className="pn-content">
        {tab === "log" && <LogVisitTab patients={patients} onSave={addVisit} onAddPatient={addPatient} />}
        {tab === "patients" && !patientObj && <PatientsTab patients={patients} visits={visits} onAddPatient={addPatient} onSelect={setSelectedPatient} />}
        {tab === "patients" && patientObj && <PatientDetail patient={patientObj} visits={visits} onBack={() => setSelectedPatient(null)} />}
        {tab === "history" && <HistoryTab patients={patients} visits={visits} />}
        {tab === "sync" && <SyncTab sheetsUrl={sheetsUrl} sheetsSecret={sheetsSecret} onSave={saveSheetsConfig} />}
      </div>
      <div className="pn-tabs">
        <button className={`pn-tab ${tab === "log" ? "active" : ""}`} onClick={() => { setTab("log"); setSelectedPatient(null); }}>📋<br/>Log Visit</button>
        <button className={`pn-tab ${tab === "patients" ? "active" : ""}`} onClick={() => { setTab("patients"); setSelectedPatient(null); }}>👤<br/>Patients</button>
        <button className={`pn-tab ${tab === "history" ? "active" : ""}`} onClick={() => { setTab("history"); setSelectedPatient(null); }}>📅<br/>History</button>
        <button className={`pn-tab ${tab === "sync" ? "active" : ""}`} onClick={() => { setTab("sync"); setSelectedPatient(null); }}>🔄<br/>Sync</button>
      </div>
      <Toast message={toast} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
